{% extends 'base.html' %}{% block content %}<h1>Staff management</h1><form class="panel" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="form-grid"><div><label>Username</label><input name="username" required minlength="3"></div><div><label>Temporary password (12+ characters)</label><input type="password" name="password" minlength="12" required></div></div><button class="btn primary">Create staff account</button></form><section class="panel"><table><tr><th>Username</th><th>Role</th><th>Active</th><th></th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ u.active }}</td><td>{% if u.role != 'admin' %}<form method="post" action="{{ url_for('toggle_staff', user_id=u.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn light small">{{ 'Disable' if u.active else 'Enable' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
